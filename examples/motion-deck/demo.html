<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="specwithcode-page" content="stage" />
    <title>Work that keeps going</title>
    <!-- A SpecWithCode stage page. Publish it with html_render (path: this file); the two
     specwithcode: scripts are inlined at publish, so the page runs offline. -->
    <script src="specwithcode:three"></script>
    <script src="specwithcode:motion-deck"></script>
    <style>
      .kicker {
        position: absolute;
        left: calc(var(--u) * 120);
        top: calc(var(--u) * 96);
        font-size: calc(var(--u) * 20);
        font-weight: 600;
        font-stretch: 112%;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(255, 248, 236, 0.78);
      }
      .kicker b {
        display: inline-block;
        min-width: 2.4em;
        color: var(--accent);
        font-weight: 700;
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: radial-gradient(60% 46% at 22% 86%, rgba(4, 6, 12, 0.5), rgba(4, 6, 12, 0) 72%);
      }
      .head {
        position: absolute;
        left: calc(var(--u) * 112);
        bottom: calc(var(--u) * 196);
        margin: 0;
        max-width: calc(var(--u) * 1300);
        font-size: calc(var(--u) * 124);
        color: #fffaf2;
        text-shadow: 0 0 calc(var(--u) * 40) rgba(0, 0, 0, 0.25);
      }
      .sub {
        position: absolute;
        left: calc(var(--u) * 120);
        bottom: calc(var(--u) * 120);
        margin: 0;
        max-width: calc(var(--u) * 1100);
        font-size: calc(var(--u) * 30);
        font-weight: 420;
        line-height: 1.35;
        color: rgba(255, 247, 236, 0.86);
      }
      .count {
        position: absolute;
        right: calc(var(--u) * 120);
        top: calc(var(--u) * 80);
        text-align: right;
        color: #fffaf2;
      }
      .count .n {
        font-size: calc(var(--u) * 120);
        font-weight: 300;
        font-stretch: 118%;
        letter-spacing: -0.02em;
      }
      .count .l {
        display: block;
        margin-top: calc(var(--u) * 12);
        font-size: calc(var(--u) * 18);
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .tag {
        position: absolute;
        font-size: calc(var(--u) * 18);
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255, 250, 242, 0.92);
        padding: calc(var(--u) * 8) calc(var(--u) * 14);
        border: 1px solid rgba(255, 250, 242, 0.35);
        border-radius: calc(var(--u) * 6);
        background: rgba(8, 6, 20, 0.28);
        backdrop-filter: blur(6px);
      }
      .mark {
        position: absolute;
        left: 0;
        right: 0;
        top: 38%;
        margin: 0;
        text-align: center;
        font-size: calc(var(--u) * 168);
        color: #fffaf2;
        text-shadow: 0 calc(var(--u) * 10) calc(var(--u) * 60) rgba(20, 40, 100, 0.55);
      }
      .mark-sub {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(38% + var(--u) * 210);
        margin: 0;
        text-align: center;
        font-size: calc(var(--u) * 30);
        font-weight: 450;
        letter-spacing: 0.04em;
        color: #fffaf2;
        text-shadow: 0 0 calc(var(--u) * 18) rgba(20, 40, 90, 0.55);
      }
    </style>
  </head>
  <body>
    <script>
      (function () {
        "use strict";
        var D = window.SpecWithCodeDeck;
        var ease = D.ease;
        var V3 = function (x, y, z) {
          return new THREE.Vector3(x, y, z);
        };
        function camera() {
          return new THREE.PerspectiveCamera(38, 16 / 9, 0.5, 9000);
        }
        // Eases a camera between keyframes: position and look-at, each [x, y, z].
        function pose(cam, from, to, k, look0, look1, drift, s) {
          var p = V3(from[0], from[1], from[2]).lerp(V3(to[0], to[1], to[2]), k);
          var l = V3(look0[0], look0[1], look0[2]).lerp(V3(look1[0], look1[1], look1[2]), k);
          var t = s.time;
          p.x += Math.sin(t * 0.13) * drift + s.mouse.x * drift * 1.5;
          p.y += Math.sin(t * 0.21) * drift * 0.4 + s.mouse.y * drift * 0.6;
          cam.position.copy(p);
          cam.lookAt(l);
        }
        // A headline and its line underneath, swapped per beat: the outgoing pair leaves upward.
        function lines(ctx, s, pairs, style, endBeat) {
          pairs.forEach(function (pair, k) {
            var head = ctx.$(pair[0]),
              sub = ctx.$(pair[1]);
            var inP = s.win(k, 0.2, 1.7);
            var leave = k + 1 < pairs.length ? k + 1 : endBeat;
            var out = leave === undefined ? 0 : s.win(leave, 0, 0.6, "inQuad");
            head.style.visibility = inP > 0 && out < 1 ? "visible" : "hidden";
            sub.style.visibility = head.style.visibility;
            ctx.type(head, inP, { style: style, out: out, stagger: 0.45 });
            ctx.type(sub, s.win(k, 0.9, 2.2), { style: "blur", out: out, stagger: 0.25 });
          });
        }
        function kicker(n, word) {
          return '<div class="scrim"></div><div class="kicker"><b>' + n + "</b>" + word + "</div>";
        }

        // ------------------------------------------------------------------ 1. plan: dawn
        var plan = {
          id: "plan",
          title: "Plan",
          bed: { notes: [50, 57, 62, 69], color: "air", level: 0.14 },
          post: function (s) {
            return {
              tone: "agx",
              exposure: 1.15,
              bloom: 0.8,
              threshold: 0.9,
              halation: 0.35,
              vignette: 0.36,
              grain: 0.03,
              contrast: 1.12,
              saturation: 1.15,
              shadows: [0.0, 0.012, 0.03],
              highlights: [0.03, 0.012, -0.01],
            };
          },
          beats: [
            {
              dur: 4,
              notes:
                "Every run starts from a plan: one spec with the goal, the tasks and the checks.",
            },
            { dur: 4, notes: "The spec breaks into tasks, each small enough for one agent." },
            { dur: 4, notes: "Nothing starts until the plan is clear." },
          ],
          html:
            '<div style="--accent:#ffcf9a">' +
            kicker("01", "Plan") +
            '<h1 class="head swc-display" id="h1">Start with a plan.</h1><p class="sub" id="s1">One spec holds the goal, the tasks and the checks.</p>' +
            '<h1 class="head swc-display" id="h2">It splits into tasks.</h1><p class="sub" id="s2">Each one small enough for a single agent to finish.</p>' +
            '<h1 class="head swc-display" id="h3">Then the work begins.</h1><p class="sub" id="s3">Every agent reads the same plan.</p></div>',
          create: function (ctx) {
            var scene = new THREE.Scene();
            var cam = camera();
            var world = ctx.world(scene, {
              sun: [0.25, 0.07, -1],
              sunColor: [4.2, 2.5, 1.5],
              zenith: [0.1, 0.2, 0.42],
              horizon: [1.05, 0.62, 0.45],
              ground: [0.2, 0.14, 0.14],
              fog: [0.8, 0.5, 0.42],
              fogDensity: 0.00045,
              fogHeight: 0.008,
            });
            world.sky({
              clouds: 0.55,
              cloudColor: [1.7, 1.2, 1.0],
              cloudShade: [0.45, 0.36, 0.42],
              sunSize: 0.0009,
            });
            world.terrain({
              height: 260,
              scale: 0.0024,
              ridge: 0.75,
              valley: 1,
              valleyWidth: 90,
              size: 5200,
              segments: 380,
              low: [0.2, 0.15, 0.13],
              high: [0.42, 0.33, 0.3],
              rock: [0.3, 0.24, 0.24],
              snow: [1.0, 0.95, 0.94],
              snowLine: 0.62,
              plateau: { center: [0, -330], radius: 300, blend: 260, height: -24 },
            });
            world.water({ level: -60, color: [0.02, 0.04, 0.06] });
            var spec = world.slab({
              position: [0, -24, -600],
              size: [120, 170, 6],
              color: [1.0, 0.93, 0.82],
              glow: 2.2,
              seed: 0.42,
              rows: 22,
            });
            var tasks = world.field({
              cols: 64,
              rows: 44,
              spacing: 7,
              jitter: 0.04,
              center: [0, -330],
              focus: [0, -600],
              tile: [4.4, 2.8],
              block: 9,
              street: 1,
              density: 0.92,
              reach: 0,
              soft: 30,
              color: [1.0, 0.9, 0.75],
              colorB: [1.0, 0.65, 0.35],
              glow: 2.4,
            });
            world.motes({
              count: 900,
              center: [0, 30, -250],
              box: [700, 160, 600],
              color: [1.0, 0.8, 0.6],
              size: 2.4,
              glow: 1.6,
            });
            return {
              scene: scene,
              camera: cam,
              beat: function (k) {
                if (k === 1) ctx.audio.hit("chime", { note: 74, gain: 0.18, verb: 0.8 });
                if (k === 2) ctx.audio.hit("rise", { gain: 0.08, dur: 2.4, note: 62 });
              },
              update: function (s) {
                lines(
                  ctx,
                  s,
                  [
                    ["#h1", "#s1"],
                    ["#h2", "#s2"],
                    ["#h3", "#s3"],
                  ],
                  "rise",
                );
                var k = ease.inOutSine(
                  Math.min(
                    1,
                    (s.win(0, 0, 4, "linear") +
                      s.win(1, 0, 4, "linear") +
                      s.win(2, 0, 4, "linear")) /
                      3,
                  ),
                );
                pose(cam, [40, 30, 140], [-50, 110, 40], k, [0, 70, -600], [0, 10, -460], 2, s);
                spec.set({
                  progress: s.win(0, 0.5, 3.5, "inOutSine") * 0.4 + s.win(1, 0, 3.5) * 0.6,
                });
                tasks.set({
                  reach: s.win(1, 0.2, 3.8, "inOutQuad") * 240 + s.win(2, 0, 3, "outCubic") * 260,
                });
              },
            };
          },
        };

        // ------------------------------------------------------------------ 2. agents: night city
        var agents = {
          id: "agents",
          title: "Agents in parallel",
          transition: "portal",
          bed: { notes: [45, 52, 57, 64], color: "warm", level: 0.13 },
          post: function (s) {
            return {
              tone: "aces",
              exposure: 1.05,
              bloom: 0.9 + s.win(1, 0, 3) * 0.35,
              threshold: 0.7,
              halation: 0.45,
              vignette: 0.4,
              grain: 0.03,
              contrast: 1.05,
              saturation: 1.1,
              shadows: [0.0, 0.01, 0.035],
              ca: 0.5,
            };
          },
          beats: [
            { dur: 4, notes: "SpecWithCode hands each task to its own agent." },
            { dur: 5, notes: "They run side by side, each in its own worktree." },
            { dur: 4, notes: "The board fills while you are away." },
          ],
          html:
            '<div style="--accent:#ffc27a">' +
            kicker("02", "Run") +
            '<div class="count"><span class="n" id="n"></span><span class="l">tasks finished</span></div>' +
            '<h1 class="head swc-display" id="h1">One agent per task.</h1><p class="sub" id="s1">Claude, Codex, Copilot and Gemini, on the subscriptions you already pay for.</p>' +
            '<h1 class="head swc-display" id="h2">All of them at once.</h1><p class="sub" id="s2">Each in its own worktree, so nobody steps on anybody.</p>' +
            '<h1 class="head swc-display" id="h3">The board fills overnight.</h1><p class="sub" id="s3">You wake up to finished work, not a blinking cursor.</p></div>',
          create: function (ctx) {
            var scene = new THREE.Scene();
            var cam = camera();
            var world = ctx.world(scene, {
              sun: [-0.15, 0.03, -1],
              sunColor: [1.8, 0.75, 0.4],
              zenith: [0.008, 0.014, 0.045],
              horizon: [0.34, 0.16, 0.15],
              ground: [0.02, 0.02, 0.03],
              fog: [0.14, 0.08, 0.09],
              fogDensity: 0.0008,
              fogHeight: 0.02,
            });
            world.sky({
              clouds: 0.35,
              cloudColor: [0.5, 0.3, 0.3],
              cloudShade: [0.05, 0.05, 0.08],
              stars: 1,
            });
            world.terrain({
              height: 110,
              scale: 0.0026,
              ridge: 0.45,
              valley: 1,
              valleyWidth: 26,
              size: 5200,
              segments: 380,
              low: [0.05, 0.045, 0.045],
              high: [0.09, 0.08, 0.08],
              rock: [0.07, 0.065, 0.065],
              snow: [0.4, 0.42, 0.5],
              ambient: 0.6,
            });
            world.water({ level: -22, color: [0.004, 0.006, 0.01], glint: 0.6 });
            var city = world.field({
              cols: 190,
              rows: 190,
              spacing: 3.4,
              center: [0, -260],
              focus: [0, -40],
              tile: [1.7, 1.05],
              density: 0.82,
              block: 14,
              minHeight: -19,
              on: 0,
              soft: 30,
              color: [1.0, 0.93, 0.82],
              colorB: [1.0, 0.62, 0.3],
              mixB: 0.18,
              glow: 2.6,
            });
            world.motes({
              count: 1200,
              center: [0, 20, -200],
              box: [700, 80, 700],
              color: [1.0, 0.75, 0.45],
              size: 1.6,
              glow: 1.4,
            });
            var counter = ctx.odometer(ctx.$("#n"));
            return {
              scene: scene,
              camera: cam,
              beat: function (k) {
                if (k === 1) ctx.audio.hit("rise", { gain: 0.08, dur: 3, note: 57 });
              },
              update: function (s) {
                lines(
                  ctx,
                  s,
                  [
                    ["#h1", "#s1"],
                    ["#h2", "#s2"],
                    ["#h3", "#s3"],
                  ],
                  "blur",
                );
                var lit =
                  6 +
                  s.win(0, 0.6, 3.6, "inQuad") * 40 +
                  s.win(1, 0, 4.5, "inOutQuad") * 300 +
                  s.win(2, 0, 3.5, "outCubic") * 520;
                city.set({ on: lit });
                counter.set(
                  Math.round(
                    3 +
                      s.win(0, 0.6, 4) * 9 +
                      s.win(1, 0, 5, "inQuad") * 880 +
                      s.win(2, 0, 4, "outCubic") * 3150,
                  ),
                );
                var k =
                  s.win(0, 0, 4, "inOutSine") * 0.2 +
                  s.win(1, 0, 5, "inOutSine") * 0.45 +
                  s.win(2, 0, 4, "inOutSine") * 0.35;
                pose(cam, [6, 8, 30], [30, 190, 330], k, [0, 0, -40], [0, -10, -330], 1.5, s);
              },
            };
          },
        };

        // ------------------------------------------------------------------ 3. hand off: twilight sea
        var handoff = {
          id: "handoff",
          title: "Hand off",
          transition: "wash",
          bed: { notes: [47, 54, 59, 66], color: "glass", level: 0.12 },
          post: function (s) {
            return {
              tone: "agx",
              exposure: 1.2,
              bloom: 0.9,
              threshold: 0.75,
              halation: 0.4,
              vignette: 0.36,
              grain: 0.032,
              contrast: 1.08,
              saturation: 1.18,
              shadows: [0.02, 0.0, 0.04],
              highlights: [0.02, 0.0, 0.02],
            };
          },
          beats: [
            { dur: 4, notes: "A machine runs out of tokens, or you close the lid." },
            { dur: 5, notes: "The thread moves to another machine with its history and worktree." },
            { dur: 4, notes: "It carries on from the same line." },
          ],
          html:
            '<div style="--accent:#f3a8ff">' +
            kicker("03", "Hand off") +
            '<div class="tag" id="ta" style="left:calc(var(--u)*300);top:calc(var(--u)*300)">MacBook · out of tokens</div>' +
            '<div class="tag" id="tb" style="right:calc(var(--u)*260);top:calc(var(--u)*270)">Mac Studio · picks up</div>' +
            '<h1 class="head swc-display" id="h1">Close the lid.</h1><p class="sub" id="s1">Or run out of tokens halfway through a task.</p>' +
            '<h1 class="head swc-display" id="h2">The work moves on.</h1><p class="sub" id="s2">The thread, its history and its worktree go to your next machine.</p>' +
            '<h1 class="head swc-display" id="h3">Same line, new machine.</h1><p class="sub" id="s3">Nothing to copy, nothing to explain twice.</p></div>',
          create: function (ctx) {
            var scene = new THREE.Scene();
            var cam = camera();
            var world = ctx.world(scene, {
              sun: [0.05, 0.04, -1],
              sunColor: [2.6, 1.1, 1.5],
              zenith: [0.025, 0.02, 0.1],
              horizon: [0.7, 0.28, 0.42],
              ground: [0.05, 0.03, 0.07],
              fog: [0.42, 0.2, 0.32],
              fogDensity: 0.00045,
              fogHeight: 0.03,
            });
            world.sky({
              clouds: 0.7,
              cloudScale: 0.9,
              cloudColor: [1.4, 0.8, 1.1],
              cloudShade: [0.25, 0.14, 0.3],
              stars: 0.4,
            });
            world.terrain({
              height: 150,
              scale: 0.004,
              ridge: 0.8,
              base: -70,
              size: 5200,
              segments: 320,
              seed: 31,
              low: [0.08, 0.06, 0.09],
              high: [0.2, 0.14, 0.2],
              rock: [0.14, 0.1, 0.14],
              snow: [0.9, 0.8, 0.95],
              snowLine: 0.8,
              ambient: 0.8,
            });
            world.water({ level: -8, color: [0.02, 0.01, 0.04], glint: 1.2 });
            var left = world.slab({
              position: [-130, -8, -260],
              size: [44, 66, 5],
              yaw: 0.45,
              color: [1.0, 0.75, 0.95],
              glow: 2.6,
              seed: 0.2,
              body: [0.015, 0.01, 0.02],
            });
            var right = world.slab({
              position: [140, -8, -330],
              size: [50, 74, 5],
              yaw: -0.4,
              color: [0.8, 0.9, 1.0],
              glow: 0.2,
              seed: 0.7,
              body: [0.015, 0.01, 0.02],
            });
            var arc = world.arcs({
              pairs: [{ from: [-120, 58, -255], to: [130, 64, -325], height: 120, width: 1.1 }],
              color: [1.0, 0.6, 1.0],
              glow: 3.2,
              progress: 0,
              packets: 4,
              speed: 0.5,
            });
            world.motes({
              count: 900,
              center: [0, 30, -300],
              box: [600, 120, 400],
              color: [1.0, 0.7, 1.0],
              size: 1.8,
              glow: 1.2,
            });
            return {
              scene: scene,
              camera: cam,
              beat: function (k) {
                if (k === 1) ctx.audio.hit("whoosh", { gain: 0.3, dur: 2.2 });
                if (k === 2) ctx.audio.hit("chime", { note: 78, gain: 0.2, verb: 0.9 });
              },
              update: function (s) {
                lines(
                  ctx,
                  s,
                  [
                    ["#h1", "#s1"],
                    ["#h2", "#s2"],
                    ["#h3", "#s3"],
                  ],
                  "track",
                );
                var send = s.win(1, 0.3, 3.4, "inOutCubic");
                arc.set({ progress: send });
                left.set({ progress: 0.62, glow: 2.6 - s.win(1, 2.5, 4.5) * 1.8 });
                right.set({
                  glow: 0.2 + s.win(1, 2.6, 4.2) * 2.6,
                  progress: 0.62 * s.win(1, 2.6, 4) + s.win(2, 0, 4) * 0.38,
                });
                var tagA = ctx.$("#ta"),
                  tagB = ctx.$("#tb");
                tagA.style.opacity = String(s.win(0, 1.4, 2.4) * (1 - s.win(2, 0, 0.8)));
                tagB.style.opacity = String(s.win(1, 2.8, 3.8) * (1 - s.win(2, 0, 0.8) * 0.0));
                var k =
                  s.win(0, 0, 4, "inOutSine") * 0.25 +
                  s.win(1, 0, 5, "inOutSine") * 0.5 +
                  s.win(2, 0, 4, "inOutSine") * 0.25;
                pose(cam, [-60, 30, 40], [40, 46, 30], k, [-60, 30, -280], [80, 30, -300], 2.5, s);
              },
            };
          },
        };

        // ------------------------------------------------------------------ 4. review: ice and a scan
        var review = {
          id: "review",
          title: "Review",
          transition: "flaps",
          bed: { notes: [52, 59, 64, 71], color: "glass", level: 0.11 },
          post: function (s) {
            return {
              tone: "agx",
              exposure: 1.05,
              bloom: 0.8,
              threshold: 0.85,
              halation: 0.2,
              vignette: 0.34,
              grain: 0.026,
              contrast: 1.12,
              saturation: 1.12,
              shadows: [0.0, 0.01, 0.03],
            };
          },
          beats: [
            { dur: 4, notes: "Every change gets a review before it lands." },
            { dur: 5, notes: "A model from another family reads it line by line." },
            { dur: 4, notes: "Findings go back to the agent; green work moves on." },
          ],
          html:
            '<div style="--accent:#7ff5c8">' +
            kicker("04", "Review") +
            '<h1 class="head swc-display" id="h1">Nothing lands unread.</h1><p class="sub" id="s1">Every change waits for a review.</p>' +
            '<h1 class="head swc-display" id="h2">A second model checks it.</h1><p class="sub" id="s2">From another family, so it does not share the first one’s blind spots.</p>' +
            '<h1 class="head swc-display" id="h3">Green moves on.</h1><p class="sub" id="s3">Findings go back to the agent that wrote the code.</p></div>',
          create: function (ctx) {
            var scene = new THREE.Scene();
            var cam = camera();
            var world = ctx.world(scene, {
              sun: [-0.5, 0.06, -1],
              sunColor: [1.2, 1.5, 2.0],
              zenith: [0.01, 0.035, 0.12],
              horizon: [0.22, 0.36, 0.55],
              ground: [0.08, 0.1, 0.14],
              fog: [0.12, 0.2, 0.32],
              fogDensity: 0.0006,
              fogHeight: 0.01,
            });
            world.sky({
              clouds: 0.4,
              cloudColor: [0.5, 0.65, 0.9],
              cloudShade: [0.05, 0.08, 0.14],
              stars: 0.6,
            });
            world.terrain({
              height: 180,
              scale: 0.0026,
              ridge: 0.9,
              valley: 1,
              valleyWidth: 70,
              size: 5200,
              segments: 380,
              seed: 12,
              low: [0.3, 0.36, 0.46],
              high: [0.6, 0.68, 0.8],
              rock: [0.1, 0.12, 0.16],
              snow: [0.8, 0.86, 0.95],
              snowLine: 0.4,
              ambient: 0.8,
              plateau: { center: [0, -260], radius: 320, blend: 260, height: -10 },
            });
            var board = world.field({
              cols: 80,
              rows: 54,
              spacing: 7,
              jitter: 0.03,
              center: [0, -260],
              tile: [4.6, 2.9],
              block: 10,
              street: 1,
              density: 0.94,
              color: [0.55, 0.75, 1.0],
              colorB: [0.75, 0.85, 1.0],
              glow: 2.2,
              body: [0.06, 0.07, 0.09],
              scan: -400,
              passColor: [0.35, 1.0, 0.7],
              failColor: [1.0, 0.35, 0.28],
              fail: 0.035,
              lift: 0.8,
            });
            world.motes({
              count: 900,
              center: [0, 30, -230],
              box: [600, 100, 500],
              color: [0.85, 0.95, 1.0],
              size: 1.8,
              glow: 1.0,
              rise: -1.5,
            });
            return {
              scene: scene,
              camera: cam,
              beat: function (k) {
                if (k === 1) ctx.audio.hit("rise", { gain: 0.07, dur: 4, note: 64 });
                if (k === 2) ctx.audio.hit("chime", { note: 76, gain: 0.18 });
              },
              update: function (s) {
                lines(
                  ctx,
                  s,
                  [
                    ["#h1", "#s1"],
                    ["#h2", "#s2"],
                    ["#h3", "#s3"],
                  ],
                  "rise",
                );
                board.set({
                  scan:
                    -300 +
                    s.win(1, 0.2, 4.8, "inOutSine") * 380 +
                    s.win(2, 0, 3.5, "outCubic") * 240,
                });
                var k =
                  s.win(0, 0, 4, "inOutSine") * 0.3 +
                  s.win(1, 0, 5, "inOutSine") * 0.45 +
                  s.win(2, 0, 4, "inOutSine") * 0.25;
                pose(
                  cam,
                  [-140, 60, 0],
                  [110, 90, -20],
                  k,
                  [-30, -10, -260],
                  [40, -10, -300],
                  2,
                  s,
                );
              },
            };
          },
        };

        // ------------------------------------------------------------------ 5. ship: above the clouds
        var ship = {
          id: "ship",
          title: "Ship",
          transition: "slam",
          bed: { notes: [50, 57, 62, 66, 69], color: "warm", level: 0.14 },
          post: function (s) {
            return {
              tone: "agx",
              exposure: 1.1,
              bloom: 0.8 + s.win(1, 0, 2) * 0.4,
              threshold: 0.85,
              halation: 0.3,
              vignette: 0.28,
              grain: 0.026,
              contrast: 1.06,
              saturation: 1.15,
              highlights: [0.02, 0.01, -0.01],
            };
          },
          beats: [
            { dur: 4, notes: "Reviewed work merges and ships." },
            { dur: 4, notes: "A release goes out from the same place you planned it." },
            { dur: 6, notes: "SpecWithCode: plan, run, hand off, review, ship." },
          ],
          html:
            '<div style="--accent:#ffd27a">' +
            kicker("05", "Ship") +
            '<h1 class="head swc-display" id="h1">Then it ships.</h1><p class="sub" id="s1">Merged, released and checked, while you were doing something else.</p>' +
            '<h1 class="head swc-display" id="h2">Work that keeps going.</h1><p class="sub" id="s2">Across agents, accounts and machines.</p>' +
            '<h1 class="mark swc-display" id="h3">SpecWithCode</h1><p class="mark-sub" id="s3">Plan · Run · Hand off · Review · Ship</p></div>',
          create: function (ctx) {
            var scene = new THREE.Scene();
            var cam = camera();
            var world = ctx.world(scene, {
              sun: [0.35, 0.16, -1],
              sunColor: [4.2, 3.0, 1.9],
              zenith: [0.006, 0.05, 0.3],
              horizon: [0.45, 0.58, 0.85],
              ground: [0.6, 0.64, 0.78],
              fog: [0.5, 0.6, 0.82],
              fogDensity: 0.00022,
              fogHeight: 0.004,
            });
            world.sky({
              clouds: 0.3,
              cloudScale: 1.4,
              cloudColor: [1.8, 1.8, 1.8],
              cloudShade: [0.6, 0.66, 0.8],
              sunSize: 0.0012,
            });
            // A sea of cloud: soft terrain in white, lit from above.
            world.terrain({
              height: 60,
              scale: 0.005,
              ridge: 0.15,
              base: -30,
              size: 6000,
              segments: 320,
              seed: 5,
              low: [0.42, 0.48, 0.66],
              high: [1.0, 0.98, 0.95],
              rock: [0.8, 0.84, 0.95],
              snow: [1.0, 1.0, 1.0],
              snowLine: 2,
              ambient: 1.1,
            });
            var beams = world.arcs({
              pairs: [
                { from: [-60, 0, -500], to: [180, 40, -900], height: 520, width: 2.6 },
                { from: [-20, 0, -480], to: [260, 20, -760], height: 380, width: 1.6 },
                { from: [-100, 0, -520], to: [80, 60, -1100], height: 640, width: 1.8 },
              ],
              color: [1.0, 0.72, 0.32],
              glow: 4.5,
              progress: 0,
              packets: 3,
              speed: 0.7,
            });
            world.motes({
              count: 1400,
              center: [0, 80, -500],
              box: [900, 240, 700],
              color: [1.0, 0.85, 0.55],
              size: 2.2,
              glow: 1.6,
            });
            return {
              scene: scene,
              camera: cam,
              beat: function (k) {
                if (k === 1) ctx.audio.hit("rise", { gain: 0.1, dur: 2.5, note: 62 });
                if (k === 2) ctx.audio.hit("boom", { gain: 0.35 });
              },
              update: function (s) {
                lines(
                  ctx,
                  s,
                  [
                    ["#h1", "#s1"],
                    ["#h2", "#s2"],
                  ],
                  "drop",
                  2,
                );
                var mark = ctx.$("#h3"),
                  markSub = ctx.$("#s3");
                ctx.type(mark, s.win(2, 0.3, 2.2), { style: "track", stagger: 0.35 });
                ctx.type(markSub, s.win(2, 1.4, 2.8), { style: "blur", stagger: 0.3 });
                beams.set({ progress: s.win(0, 0.4, 3.6, "inOutCubic") });
                var k =
                  s.win(0, 0, 4, "inOutSine") * 0.35 +
                  s.win(1, 0, 4, "inOutSine") * 0.35 +
                  s.win(2, 0, 6, "inOutSine") * 0.3;
                pose(cam, [0, 60, 80], [-40, 110, 160], k, [40, 90, -600], [40, 160, -700], 3, s);
              },
            };
          },
        };

        D.start({ title: "Work that keeps going", scenes: [plan, agents, handoff, review, ship] });
      })();
    </script>
  </body>
</html>
