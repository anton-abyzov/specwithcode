<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="specwithcode-page" content="stage" />
    <title>Work that keeps going</title>
    <!-- A SpecWithCode stage page. Publish it with html_render (path: this file); the two
     specwithcode: scripts are inlined at publish, so the page runs offline. -->
    <script src="specwithcode:three"></script>
    <script src="specwithcode:motion-deck"></script>
    <style>
      :root {
        --swc-font:
          "SF Pro Display", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .kicker {
        position: absolute;
        left: calc(var(--u) * 120);
        top: calc(var(--u) * 104);
        font-size: calc(var(--u) * 22);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #a9b4c8;
      }
      .kicker b {
        color: #ffd59a;
        font-weight: 600;
        margin-right: 0.9em;
      }
      .head {
        position: absolute;
        left: calc(var(--u) * 116);
        bottom: calc(var(--u) * 150);
        margin: 0;
        max-width: calc(var(--u) * 1180);
        font-size: calc(var(--u) * 96);
        line-height: 1.02;
        font-weight: 600;
        letter-spacing: -0.025em;
      }
      .sub {
        position: absolute;
        left: calc(var(--u) * 120);
        bottom: calc(var(--u) * 96);
        margin: 0;
        font-size: calc(var(--u) * 28);
        color: #b9c0cc;
        letter-spacing: 0.005em;
      }
      .stack {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 100%;
        background: radial-gradient(
          70% 55% at 18% 92%,
          rgba(3, 4, 10, 0.78),
          rgba(3, 4, 10, 0) 70%
        );
      }
      .stack > .head,
      .stack > .sub {
        transition: none;
      }
      .count {
        position: absolute;
        right: calc(var(--u) * 120);
        top: calc(var(--u) * 92);
        text-align: right;
      }
      .count .n {
        font-size: calc(var(--u) * 132);
        font-weight: 600;
        letter-spacing: -0.03em;
        color: #f6f2ea;
      }
      .count .l {
        display: block;
        margin-top: calc(var(--u) * 10);
        font-size: calc(var(--u) * 22);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #9fe3cf;
      }
    </style>
  </head>
  <body>
    <script>
      (function () {
        "use strict";
        var D = window.SpecWithCodeDeck;

        // Headlines that swap per beat: the outgoing line sinks while the next one rises.
        function headlines(ctx, s, ids) {
          ids.forEach(function (id, k) {
            var node = ctx.$(id);
            var shown =
              s.win(k, 0, 1.1, "outQuart") *
              (k + 1 < ids.length ? 1 - s.win(k + 1, 0, 0.35, "inQuad") : 1);
            node.style.opacity = shown > 0.001 ? "1" : "0";
            ctx.rise(node, shown, { stagger: 0.3 });
          });
        }

        // ------------------------------------------------------------------ 1. constellation
        var constellation = {
          id: "plan",
          title: "Constellation",
          transition: "iris",
          bed: { notes: [50, 57, 62, 69], color: "air", level: 0.14 },
          post: function (s) {
            return {
              bloom: 1.25 + s.win(2, 0, 2.5) * 0.6,
              threshold: 0.75,
              vignette: 0.42,
              grain: 0.035,
              exposure: 1.05,
              lift: [0.004, 0.006, 0.014],
            };
          },
          beats: [
            { dur: 2.6, notes: "Open on noise. Thousands of points, each a loose idea." },
            { dur: 3.2, notes: "The plan pulls them into one shape." },
            { dur: 3.0, notes: "The shape turns, and starts to move." },
          ],
          html:
            '<div class="kicker"><b>01</b>Plan</div>' +
            '<div class="stack"><h1 class="head" id="h0">Every project starts as noise.</h1>' +
            '<h1 class="head" id="h1">A plan gives it a shape.</h1>' +
            '<h1 class="head" id="h2">Then the work starts to move.</h1></div>',
          create: function (ctx) {
            var THREE = ctx.THREE,
              R = ctx.rng(7),
              N = 14000;
            var scene = new THREE.Scene();
            scene.background = new THREE.Color(0.003, 0.004, 0.011);
            var camera = new THREE.PerspectiveCamera(38, 16 / 9, 0.1, 200);
            var start = new Float32Array(N * 3),
              target = new Float32Array(N * 3),
              seed = new Float32Array(N);
            for (var i = 0; i < N; i++) {
              // Start: a wide, flat drift of points.
              var u = R() * Math.PI * 2,
                r0 = Math.pow(R(), 0.5) * 14;
              start[i * 3] = Math.cos(u) * r0;
              start[i * 3 + 1] = (R() - 0.5) * 8;
              start[i * 3 + 2] = Math.sin(u) * r0 - 4;
              // Target: a four-armed spiral with a bright core.
              var arm = i % 4,
                t = Math.pow(R(), 0.7),
                a = (arm * Math.PI) / 2 + t * 5.2 + ((R() - 0.5) * 0.5) / (0.3 + t);
              var rad = 0.25 + t * 5.4,
                spread = 0.12 + t * 0.35;
              target[i * 3] = Math.cos(a) * rad + (R() - 0.5) * spread;
              target[i * 3 + 1] = (R() - 0.5) * (0.5 - t * 0.35);
              target[i * 3 + 2] = Math.sin(a) * rad + (R() - 0.5) * spread;
              seed[i] = R();
            }
            var g = new THREE.BufferGeometry();
            g.setAttribute("position", new THREE.BufferAttribute(start, 3));
            g.setAttribute("aTarget", new THREE.BufferAttribute(target, 3));
            g.setAttribute("aSeed", new THREE.BufferAttribute(seed, 1));
            var mat = new THREE.ShaderMaterial({
              uniforms: {
                uMorph: { value: 0 },
                uTime: { value: 0 },
                uScale: { value: 1 },
                uBright: { value: 1 },
                uSpin: { value: 0 },
              },
              vertexShader:
                ctx.glsl.hash +
                "attribute vec3 aTarget;attribute float aSeed;uniform float uMorph,uTime,uScale,uSpin;varying vec3 vColor;varying float vSeed;" +
                "void main(){float m=smoothstep(aSeed*0.45,0.55+aSeed*0.45,uMorph);vec3 p=mix(position,aTarget,m);" +
                "p+=vec3(sin(uTime*0.4+aSeed*40.0),cos(uTime*0.33+aSeed*17.0),sin(uTime*0.27+aSeed*9.0))*0.06*(1.0-m*0.6);" +
                "float a=uSpin*(0.4+0.6/(0.6+length(p.xz)));float c=cos(a),s=sin(a);p.xz=mat2(c,-s,s,c)*p.xz;" +
                "vec4 mv=modelViewMatrix*vec4(p,1.0);gl_Position=projectionMatrix*mv;" +
                "float tw=0.65+0.35*sin(uTime*(1.0+aSeed*3.0)+aSeed*60.0);gl_PointSize=uScale*(1.6+aSeed*aSeed*5.0)*tw*(9.0/-mv.z);" +
                "float core=1.0-smoothstep(0.0,2.2,length(aTarget.xz))*m;" +
                "vColor=mix(vec3(0.55,0.72,1.25),vec3(1.6,1.05,0.55),core*0.8+aSeed*0.25)*(0.6+core*2.4);vSeed=aSeed;}",
              fragmentShader:
                "uniform float uBright;varying vec3 vColor;varying float vSeed;void main(){vec2 q=gl_PointCoord-0.5;float d=dot(q,q);" +
                "float a=exp(-d*26.0)+exp(-d*180.0)*1.5;gl_FragColor=vec4(vColor*a*uBright,1.0);}",
              transparent: true,
              depthWrite: false,
              blending: THREE.AdditiveBlending,
            });
            var points = new THREE.Points(g, mat);
            points.frustumCulled = false;
            scene.add(points);
            // A faint dust layer far behind, for depth.
            var dust = new Float32Array(3000 * 3);
            for (var j = 0; j < 3000; j++) {
              dust[j * 3] = (R() - 0.5) * 90;
              dust[j * 3 + 1] = (R() - 0.5) * 50;
              dust[j * 3 + 2] = -30 - R() * 40;
            }
            var dg = new THREE.BufferGeometry();
            dg.setAttribute("position", new THREE.BufferAttribute(dust, 3));
            scene.add(
              new THREE.Points(
                dg,
                new THREE.PointsMaterial({
                  color: new THREE.Color(0.35, 0.42, 0.6),
                  size: 0.09,
                  sizeAttenuation: true,
                  depthWrite: false,
                }),
              ),
            );
            return {
              scene: scene,
              camera: camera,
              beat: function (k) {
                if (k > 0) ctx.audio.hit("chime", { note: [69, 74, 76][k], gain: 0.28, verb: 0.8 });
                if (k === 1) ctx.audio.hit("rise", { gain: 0.12, dur: 2.4, note: 62 });
              },
              update: function (s) {
                var morph = s.win(1, 0, 3.0, "inOutCubic");
                mat.uniforms.uMorph.value = morph;
                mat.uniforms.uTime.value = s.time;
                mat.uniforms.uScale.value =
                  (ctx.renderer.getDrawingBufferSize(new THREE.Vector2()).y / 1080) * 2.2;
                mat.uniforms.uSpin.value =
                  s.time * 0.05 +
                  s.win(2, 0, 3.0, "inOutSine") * 1.2 +
                  s.win(2, 0, 30, "linear") * 4;
                mat.uniforms.uBright.value =
                  0.55 +
                  s.win(0, 0, 2.0, "outCubic") * 0.45 +
                  s.win(2, 0.2, 1.8, "outCubic") * 0.35;
                var push = s.win(2, 0, 3.0, "inOutCubic");
                var dolly = 18 - morph * 3.5 - push * 4.5 + (1 - s.enter) * 6;
                var tilt = 0.42 + morph * 0.28 - push * 0.32;
                camera.position.set(
                  Math.sin(s.mouse.x * 0.08) * dolly * 0.2,
                  Math.sin(tilt) * dolly + s.mouse.y * 0.3,
                  Math.cos(tilt) * dolly,
                );
                camera.lookAt(push * 0.6, -push * 0.2, 0);
                headlines(ctx, s, ["#h0", "#h1", "#h2"]);
              },
            };
          },
        };

        // ------------------------------------------------------------------ 2. task grid
        var grid = {
          id: "tasks",
          title: "Task grid",
          transition: "wipe",
          bed: { notes: [52, 59, 64, 71], color: "glass", level: 0.13 },
          post: {
            bloom: 0.95,
            threshold: 0.85,
            vignette: 0.38,
            grain: 0.03,
            exposure: 1.0,
            lift: [0.004, 0.005, 0.01],
          },
          beats: [
            { dur: 2.2, notes: "A grid of tasks rises, one tile each." },
            {
              dur: 5.5,
              notes: "Agents pick them up. Amber is running, teal is done; the counter rolls.",
            },
            { dur: 2.6, notes: "Everything lands. The camera settles over the finished board." },
          ],
          html:
            '<div class="kicker"><b>02</b>Do</div>' +
            '<div class="count"><span class="n" id="odo"></span><span class="l">tasks finished</span></div>' +
            '<div class="stack"><h1 class="head" id="g0">Each task is one small, checkable step.</h1>' +
            '<h1 class="head" id="g1">Agents pick them up while you sleep.</h1>' +
            '<h1 class="head" id="g2">You wake up to a finished board.</h1></div>',
          create: function (ctx) {
            var THREE = ctx.THREE,
              R = ctx.rng(11),
              COLS = 32,
              ROWS = 18,
              N = COLS * ROWS;
            var scene = new THREE.Scene();
            scene.background = new THREE.Color(0.004, 0.005, 0.01);
            var camera = new THREE.PerspectiveCamera(30, 16 / 9, 0.1, 200);
            var geo = new THREE.BoxGeometry(0.86, 0.16, 0.86);
            var rank = new Float32Array(N),
              cell = new Float32Array(N * 2);
            var m4 = new THREE.Matrix4();
            for (var i = 0; i < N; i++) {
              var cx = (i % COLS) - (COLS - 1) / 2,
                cz = Math.floor(i / COLS) - (ROWS - 1) / 2;
              // Work flows roughly left to right, with some tasks finishing out of order.
              rank[i] = Math.min(0.999, Math.max(0, ((i % COLS) / COLS) * 0.7 + R() * 0.3));
              cell[i * 2] = cx;
              cell[i * 2 + 1] = cz;
            }
            geo.setAttribute("aRank", new THREE.InstancedBufferAttribute(rank, 1));
            geo.setAttribute("aCell", new THREE.InstancedBufferAttribute(cell, 2));
            var mat = new THREE.ShaderMaterial({
              uniforms: {
                uRise: { value: 0 },
                uDone: { value: 0 },
                uTime: { value: 0 },
                uSettle: { value: 0 },
              },
              vertexShader:
                "attribute float aRank;attribute vec2 aCell;uniform float uRise,uDone,uTime,uSettle;varying vec3 vN;varying float vState,vTop,vRun;varying vec2 vUv;" +
                "void main(){float d=length(aCell*vec2(0.6,1.0))/18.0;float r=clamp(uRise*1.8-d*1.3,0.0,1.0);r=1.0-pow(1.0-r,3.0);" +
                "float done=step(aRank,uDone);float run=(1.0-done)*step(aRank,uDone+0.07);" +
                "vec3 p=position;p.y*=1.0+done*1.2+run*(2.4+sin(uTime*7.0+aRank*90.0)*0.8);" +
                "vec4 w=instanceMatrix*vec4(p,1.0);w.y+=(r-1.0)*3.5+done*0.12*(1.0-uSettle)+run*0.25;w.xz*=mix(1.12,1.0,r);" +
                "vN=normal;vTop=step(0.5,normal.y);vState=done;vRun=run;vUv=position.xz/0.86+0.5;gl_Position=projectionMatrix*viewMatrix*w;}",
              fragmentShader:
                "uniform float uTime;varying vec3 vN;varying float vState,vTop,vRun;varying vec2 vUv;void main(){" +
                "float l=0.35+0.65*max(dot(normalize(vN),normalize(vec3(0.4,1.0,0.3))),0.0);" +
                "vec3 base=vec3(0.035,0.042,0.06)*l;vec2 e=min(vUv,1.0-vUv);float edge=1.0-smoothstep(0.0,0.07,min(e.x,e.y));" +
                "base+=vec3(0.07,0.09,0.14)*edge*vTop;" +
                "vec3 done=vec3(0.03,0.26,0.21)*(0.45+0.55*l)+vec3(0.35,1.9,1.45)*edge*vTop;" +
                "vec3 run=vec3(1.9,0.95,0.22)*(0.7+0.3*sin(uTime*9.0))*(0.5+0.5*l);" +
                "gl_FragColor=vec4(mix(mix(base,done,vState),run,vRun),1.0);}",
            });
            var mesh = new THREE.InstancedMesh(geo, mat, N);
            for (var k = 0; k < N; k++) {
              m4.makeTranslation(cell[k * 2], 0, cell[k * 2 + 1]);
              mesh.setMatrixAt(k, m4);
            }
            mesh.frustumCulled = false;
            scene.add(mesh);
            var odo = ctx.odometer(ctx.$("#odo"));
            var lastDone = 0;
            return {
              scene: scene,
              camera: camera,
              beat: function (k) {
                if (k === 2) ctx.audio.hit("chime", { note: 76, gain: 0.3, verb: 0.9 });
                if (k === 0) ctx.audio.hit("boom", { gain: 0.18 });
              },
              update: function (s) {
                var rise = s.win(0, 0, 2.0, "linear");
                var done =
                  s.win(1, 0, 5.2, "inOutQuad") * 0.93 + s.win(2, 0, 1.4, "outCubic") * 0.08;
                var settle = s.win(2, 0, 2.4, "inOutCubic");
                mat.uniforms.uRise.value = rise;
                mat.uniforms.uDone.value = done;
                mat.uniforms.uTime.value = s.time;
                mat.uniforms.uSettle.value = settle;
                var count = Math.round(1284 * Math.min(1, done));
                odo.set(count);
                if (count - lastDone >= 24) {
                  ctx.audio.hit("tick", { gain: 0.08, pan: Math.random() * 1.2 - 0.6 });
                  lastDone = count;
                }
                if (count < lastDone) lastDone = count;
                ctx.$(".count").style.opacity = String(s.win(1, 0, 0.6));
                var orbit =
                  -0.5 + s.win(1, 0, 5.5, "inOutSine") * 0.45 + settle * 0.05 + s.mouse.x * 0.04;
                var height = 15 - settle * 5 + (1 - s.enter) * 4,
                  dist = 22 - settle * 4;
                camera.position.set(
                  Math.sin(orbit) * dist,
                  height + s.mouse.y * 0.4,
                  Math.cos(orbit) * dist,
                );
                camera.lookAt(-3.5 + settle * 1.5, -3.2 + settle * 1.6, 2.5 - settle * 1.5);
                headlines(ctx, s, ["#g0", "#g1", "#g2"]);
              },
            };
          },
        };

        // ------------------------------------------------------------------ 3. linked nodes
        var network = {
          id: "handoff",
          title: "Linked machines",
          transition: "fade",
          bed: { notes: [45, 52, 57, 64, 69], color: "warm", level: 0.15 },
          post: function (s) {
            return {
              bloom: 1.15,
              threshold: 0.8,
              vignette: 0.4,
              grain: 0.032,
              ca: 0.5,
              exposure: 1.0 + s.win(2, 1.5, 3.0) * 0.15,
              lift: [0.006, 0.004, 0.012],
            };
          },
          beats: [
            { dur: 2.2, notes: "Machines appear: a laptop, a desktop, a server." },
            { dur: 2.4, notes: "They link up." },
            { dur: 4.0, notes: "Work travels between them as pulses. Close: one line." },
          ],
          html:
            '<div class="kicker"><b>03</b>Hand off</div>' +
            '<div class="stack"><h1 class="head" id="n0">Your machines, one workspace.</h1>' +
            '<h1 class="head" id="n1">Linked, so work can move.</h1>' +
            '<h1 class="head" id="n2">Hand off. Pick up. Keep going.</h1>' +
            '<p class="sub" id="nsub">An original SpecWithCode stage page, made with specwithcode:three and specwithcode:motion-deck.</p></div>',
          create: function (ctx) {
            var THREE = ctx.THREE,
              R = ctx.rng(23);
            var scene = new THREE.Scene();
            scene.background = new THREE.Color(0.006, 0.004, 0.01);
            var camera = new THREE.PerspectiveCamera(36, 16 / 9, 0.1, 200);
            var nodes = [];
            for (var i = 0; i < 11; i++) {
              var a = (i / 11) * Math.PI * 2 + R() * 0.4,
                r = i === 0 ? 0 : 3.2 + R() * 2.6;
              nodes.push(
                new THREE.Vector3(Math.cos(a) * r * 1.35, (R() - 0.5) * 2.4, Math.sin(a) * r * 0.8),
              );
            }
            var edges = [];
            for (var e = 1; e < nodes.length; e++) {
              edges.push([0, e]);
              if (R() > 0.35) edges.push([e, (e % (nodes.length - 1)) + 1]);
            }
            // Nodes: bright cores with a soft halo sprite.
            var coreGeo = new THREE.IcosahedronGeometry(0.16, 2);
            var cores = nodes.map(function (p, k) {
              var m = new THREE.Mesh(
                coreGeo,
                new THREE.MeshBasicMaterial({
                  color: k === 0 ? new THREE.Color(3.2, 2.2, 1.1) : new THREE.Color(1.1, 1.6, 3.0),
                }),
              );
              m.position.copy(p);
              scene.add(m);
              return m;
            });
            var haloPos = new Float32Array(nodes.length * 3);
            nodes.forEach(function (p, k) {
              p.toArray(haloPos, k * 3);
            });
            var haloGeo = new THREE.BufferGeometry();
            haloGeo.setAttribute("position", new THREE.BufferAttribute(haloPos, 3));
            var glow = {
              uniforms: {
                uScale: { value: 1 },
                uSize: { value: 60 },
                uAlpha: { value: 0 },
                uColor: { value: new THREE.Color(0.5, 0.7, 1.4) },
              },
              vertexShader:
                "uniform float uScale,uSize;void main(){vec4 mv=modelViewMatrix*vec4(position,1.0);gl_Position=projectionMatrix*mv;gl_PointSize=uSize*uScale*(10.0/-mv.z);}",
              fragmentShader:
                "uniform float uAlpha;uniform vec3 uColor;void main(){vec2 q=gl_PointCoord-0.5;float d=dot(q,q);gl_FragColor=vec4(uColor*(exp(-d*14.0)*0.6+exp(-d*90.0))*uAlpha,1.0);}",
              transparent: true,
              depthWrite: false,
              blending: THREE.AdditiveBlending,
            };
            var haloMat = new THREE.ShaderMaterial(glow);
            var halos = new THREE.Points(haloGeo, haloMat);
            halos.frustumCulled = false;
            scene.add(halos);
            // Links: each segment carries its own 0..1 along-edge value, so it can draw in.
            var linkPos = new Float32Array(edges.length * 6),
              linkT = new Float32Array(edges.length * 2),
              linkSeed = new Float32Array(edges.length * 2);
            edges.forEach(function (pair, k) {
              nodes[pair[0]].toArray(linkPos, k * 6);
              nodes[pair[1]].toArray(linkPos, k * 6 + 3);
              linkT[k * 2] = 0;
              linkT[k * 2 + 1] = 1;
              linkSeed[k * 2] = linkSeed[k * 2 + 1] = k / edges.length;
            });
            var linkGeo = new THREE.BufferGeometry();
            linkGeo.setAttribute("position", new THREE.BufferAttribute(linkPos, 3));
            linkGeo.setAttribute("aT", new THREE.BufferAttribute(linkT, 1));
            linkGeo.setAttribute("aSeed", new THREE.BufferAttribute(linkSeed, 1));
            var linkMat = new THREE.ShaderMaterial({
              uniforms: { uDraw: { value: 0 } },
              vertexShader:
                "attribute float aT,aSeed;varying float vT,vSeed;void main(){vT=aT;vSeed=aSeed;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
              fragmentShader:
                "uniform float uDraw;varying float vT,vSeed;void main(){float d=clamp(uDraw*1.6-vSeed*0.6,0.0,1.0);if(vT>d)discard;gl_FragColor=vec4(vec3(0.35,0.5,0.95)*(0.6+1.4*smoothstep(d-0.08,d,vT)),1.0);}",
              transparent: true,
              depthWrite: false,
              blending: THREE.AdditiveBlending,
            });
            scene.add(new THREE.LineSegments(linkGeo, linkMat));
            // Pulses: bright points that run along random links.
            var P = 90,
              pulsePos = new Float32Array(P * 3),
              pulses = [];
            for (var q = 0; q < P; q++)
              pulses.push({
                edge: Math.floor(R() * edges.length),
                t: R(),
                speed: 0.25 + R() * 0.5,
                dir: R() > 0.5 ? 1 : -1,
              });
            var pulseGeo = new THREE.BufferGeometry();
            pulseGeo.setAttribute("position", new THREE.BufferAttribute(pulsePos, 3));
            var pulseMat = new THREE.ShaderMaterial(
              Object.assign({}, glow, {
                uniforms: {
                  uScale: { value: 1 },
                  uSize: { value: 16 },
                  uAlpha: { value: 0 },
                  uColor: { value: new THREE.Color(2.6, 1.7, 0.8) },
                },
              }),
            );
            var pulsePoints = new THREE.Points(pulseGeo, pulseMat);
            pulsePoints.frustumCulled = false;
            scene.add(pulsePoints);
            var tmp = new THREE.Vector3(),
              lastPop = 0;
            return {
              scene: scene,
              camera: camera,
              beat: function (k) {
                if (k === 1) ctx.audio.hit("whoosh", { gain: 0.18, dur: 1.4 });
                if (k === 2) {
                  ctx.audio.chord([45, 52, 59, 64, 71], 1.2);
                  ctx.audio.hit("chime", { note: 81, gain: 0.25, verb: 0.9 });
                }
              },
              update: function (s) {
                var scale = ctx.renderer.getDrawingBufferSize(new THREE.Vector2()).y / 1080;
                var appear = s.win(0, 0, 1.8, "outBack");
                cores.forEach(function (m, k) {
                  var a = ctx.clamp01(appear * 1.4 - k * 0.04);
                  m.scale.setScalar(Math.max(0.001, a));
                });
                haloMat.uniforms.uScale.value = scale;
                haloMat.uniforms.uAlpha.value = s.win(0, 0.2, 1.8, "outCubic");
                linkMat.uniforms.uDraw.value = s.win(1, 0, 2.0, "inOutCubic");
                var flow = s.win(2, 0, 1.0, "outCubic");
                pulseMat.uniforms.uScale.value = scale;
                pulseMat.uniforms.uAlpha.value = flow;
                pulses.forEach(function (p, k) {
                  p.t += s.dt * p.speed * (0.5 + flow);
                  if (p.t > 1) {
                    p.t -= 1;
                    p.edge = Math.floor(Math.random() * edges.length);
                    if (flow > 0.5 && s.time - lastPop > 0.12) {
                      ctx.audio.hit("pop", {
                        gain: 0.06,
                        note: 79 + (k % 5) * 2,
                        pan: Math.random() - 0.5,
                        verb: 0.6,
                      });
                      lastPop = s.time;
                    }
                  }
                  var pair = edges[p.edge],
                    t = p.dir > 0 ? p.t : 1 - p.t;
                  tmp.lerpVectors(nodes[pair[0]], nodes[pair[1]], t).toArray(pulsePos, k * 3);
                });
                pulseGeo.attributes.position.needsUpdate = true;
                var orbit = s.time * 0.06 + s.mouse.x * 0.1,
                  close = s.win(2, 1.5, 4.0, "inOutCubic");
                var dist = 17 - close * 3 + (1 - s.enter) * 5;
                camera.position.set(
                  Math.sin(orbit) * dist,
                  5.5 - close * 2 + s.mouse.y * 0.4,
                  Math.cos(orbit) * dist,
                );
                camera.lookAt(-2.6 + close * 0.8, -1.4 - close * 0.4, 0);
                headlines(ctx, s, ["#n0", "#n1", "#n2"]);
                var sub = ctx.$("#nsub");
                sub.style.opacity = String(s.win(2, 1.6, 2.6, "outCubic"));
              },
            };
          },
        };

        D.start({ title: "Work that keeps going", scenes: [constellation, grid, network] });
      })();
    </script>
  </body>
</html>
