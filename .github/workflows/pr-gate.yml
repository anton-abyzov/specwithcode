name: PR Gate

# Runs scripts/studio-verify/pr-gate.sh on every ready pull request: the theme
# contrast test, every workspace package's tests, the typecheck gate (new
# diagnostics only, in its own job: the server's tsc alone peaks near 11 GB)
# and the server tests vitest ties to the change. The fleet
# tests need macOS and run in pr-gate-fleet.yml when the fleet changes. It is the gate agents ran on the Mac before each merge and the same
# set release.sh's stage 1 runs, so a green PR here does not fail the release.
# The full inherited suite stays available on demand in ci.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: PR Gate
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The server stage needs the merge base with main.
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Fetch main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      # ACP process-tree tests compile a pthread fixture with `cc`; the desktop
      # tests build the browser secret helper against libsecret.
      - name: Install native build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libsecret-1-dev pkg-config

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          # release-version.test.mjs pins the exact release Node.
          node-version: 22.20.0
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @specweave-studio/desktop ensure:electron

      - name: Install Playwright Chromium headless shell
        run: node apps/server/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium

      - name: Run the PR gate
        env:
          CI: "1"
          GIT_CONFIG_NOSYSTEM: "1"
          # Four cores: four suites of four vitest workers each starved the runner, and
          # timing-sensitive tests timed out. Two suites of two workers each fit.
          VITEST_MAX_WORKERS: "2"
        run: bash scripts/studio-verify/pr-gate.sh --base origin/main --out "$RUNNER_TEMP/pr-gate" --jobs 2 --server-shards 2 --skip typecheck

      - name: Upload gate logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pr-gate-logs
          path: ${{ runner.temp }}/pr-gate
          if-no-files-found: ignore
          retention-days: 7

  typecheck:
    name: PR Gate (typecheck)
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 22.20.0
          cache: true
          run-install: true

      # One package at a time, two checkers: apps/server's tsc otherwise peaks near
      # 11 GB, and the runner has 16 GB.
      - name: Run the typecheck gate
        env:
          CI: "1"
          TYPECHECK_TSC_ARGS: --checkers 2
        run: bash scripts/studio-verify/typecheck-gate.sh --jobs 1 --out "$RUNNER_TEMP/typecheck"

      - name: Upload typecheck logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pr-gate-typecheck-logs
          path: ${{ runner.temp }}/typecheck
          if-no-files-found: ignore
          retention-days: 7
