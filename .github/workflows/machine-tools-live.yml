# Installs the real pinned Node.js and GitHub CLI, and SpecWeave from npm, into
# an empty app home on Windows, Linux and macOS, the way machine readiness does
# on a person's machine (no admin rights, no shell profile). Runs when the
# installer or its pins change; nothing else in CI downloads them.
name: Machine tools live install

on:
  pull_request:
    paths:
      - apps/server/src/machineTools/**
      - apps/server/src/provision/manifest.ts
      - .github/workflows/machine-tools-live.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: machine-tools-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: Live install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+
        env:
          npm_config_global_pnpmfile: ${{ github.workspace }}/scripts/studio-toolchain/bootstrap-pnpmfile.cjs
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install
        run: vp install

      - name: Live install into an empty home
        working-directory: apps/server
        env:
          STUDIO_MACHINE_TOOLS_LIVE: "1"
        run: vp test run src/machineTools/machineTools.test.ts -t "live pinned installs"
