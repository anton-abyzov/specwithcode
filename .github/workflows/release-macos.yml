name: Release macOS

# One-button SpecWithCode release on a Mac runner: scripts/release/release.sh --ci, the same
# stages the M4 runs (stage 1, server suite, signed and notarized build, bundle, plan, drafts,
# both feeds, merge) minus the fleet rollout and the desktop swap. The hosts' update agents
# install the release from the public feed on their next hourly check; on the M4,
# `python3 -B scripts/studio-fleet/fleet_rollout.py --version X.Y.Z` asks them at once.
#
# Runner: the self-hosted M1 release Mac, selected by its `swc-release` label. The repository
# variable RELEASE_MACOS_RUNNER may name a replacement self-hosted Mac deliberately; it is not a
# silent fallback to a GitHub-hosted runner or to building on M4. The M1 staging folder survives,
# so a failed run continues with `resume`.
#
# Secrets (names only; values never leave the `release` environment's secret store):
#   RELEASE_GH_TOKEN   fine-grained token with contents, pull requests and workflows write on
#                      this repository (the run pushes release/<version>, makes the release
#                      and tags it)
#   CSC_LINK, CSC_KEY_PASSWORD                       Developer ID Application .p12 (base64) and passphrase
#   APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER  App Store Connect key (.p8 text) for notarization
#   STUDIO_GOOGLE_OAUTH_CLIENT_ID, STUDIO_GOOGLE_OAUTH_CLIENT_SECRET  the built-in Google pair
#
# Repository variables (public identifiers; optional): STUDIO_CLERK_PUBLISHABLE_KEY,
# STUDIO_CLERK_JWT_TEMPLATE, STUDIO_CLERK_CLI_OAUTH_CLIENT_ID, STUDIO_RELAY_URL. With all four
# set the release ships SpecWithCode Connect on; otherwise it builds without it
# (docs/operations/connect-launch.md).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (1.x.y)
        required: true
        type: string
      previous:
        description: Previous release, when it cannot be found on its own (optional)
        required: false
        type: string
      stop_after:
        description: Stop after this stage, for example drafts (optional)
        required: false
        type: string
      resume:
        description: Continue a release whose staging folder is on this runner (self-hosted only)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release:
    name: Release SpecWithCode ${{ inputs.version }}
    runs-on: ${{ vars.RELEASE_MACOS_RUNNER || 'swc-release' }}
    environment: release
    timeout-minutes: 240
    # RELEASE_GH_TOKEN goes only to the steps that call gh or git against GitHub (Check secrets,
    # Checkout, Release), not to the toolchain installs and third-party actions between them.
    env:
      GIT_TERMINAL_PROMPT: "0"
      PWDEBUG: "0"
      PLAYWRIGHT_HTML_OPEN: never
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check secrets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          STUDIO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.STUDIO_GOOGLE_OAUTH_CLIENT_ID }}
          STUDIO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.STUDIO_GOOGLE_OAUTH_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in GH_TOKEN CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER \
            STUDIO_GOOGLE_OAUTH_CLIENT_ID STUDIO_GOOGLE_OAUTH_CLIENT_SECRET; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Missing repository secrets: %s (GH_TOKEN comes from RELEASE_GH_TOKEN). See the header of release-macos.yml.\n' "${missing[*]}"
            exit 1
          fi

      # As in desktop-macos-unsigned.yml: actions/checkout's cleanup trips on the orphaned
      # gitlinks in .repos, so fetch by hand and leave .repos out. Full history with every blob:
      # release notes and the stage-1 tree need commits back to the previous release, and stage-1
      # tests run without a GitHub token, so nothing may be left to fetch on demand (release.sh --ci
      # also fetches, before stage 1, the off-main commits the preservation audits read).
      - name: Checkout
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" 2> /dev/null ||
            git remote set-url origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git config --local credential.https://github.com.helper '!gh auth git-credential'
          git fetch -q --no-tags origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout -q --detach "origin/${GITHUB_REF_NAME}"

      # The desktop app's voice helper (native/voice) uses SpeechAnalyzer from the macOS 26 SDK,
      # which Xcode 16 lacks. Keep the runner's Xcode when it is already 26 or later, otherwise
      # point DEVELOPER_DIR at the newest installed Xcode 26 or later. Read xcodebuild's whole
      # output first: piping it into `head` closes the pipe early, and xcodebuild aborts on the
      # failed write (seen on a self-hosted Mac with Xcode 27).
      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          major() { DEVELOPER_DIR="$1" xcodebuild -version 2> /dev/null | sed -n '1s/^Xcode \([0-9][0-9]*\).*/\1/p' || true; }
          current="$(major "${DEVELOPER_DIR:-$(xcode-select -p)}")"
          if [ -n "$current" ] && [ "$current" -ge 26 ]; then
            xcodebuild -version
            exit 0
          fi
          xcode=""
          for app in $(ls -d /Applications/Xcode*.app 2> /dev/null | sort -V); do
            v="$(major "$app/Contents/Developer")"
            if [ -n "$v" ] && [ "$v" -ge 26 ]; then xcode="$app"; fi
          done
          if [ -z "$xcode" ]; then
            echo "No Xcode 26 or later on this runner; installed:" >&2
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # release.sh's preflight requires exactly this Node.
          node-version: 22.20.0

      - name: Setup pnpm
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "pnpm@$(sed -n 's/.*"packageManager": *"pnpm@\([0-9.]*\)".*/\1/p' package.json)"
          pnpm -v

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      # Everything release.sh reads from outside the repository, written mode 600 under the
      # runner's temp folder and removed by the last step.
      - name: Write release settings
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          STUDIO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.STUDIO_GOOGLE_OAUTH_CLIENT_ID }}
          STUDIO_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.STUDIO_GOOGLE_OAUTH_CLIENT_SECRET }}
          STUDIO_CLERK_PUBLISHABLE_KEY: ${{ vars.STUDIO_CLERK_PUBLISHABLE_KEY }}
          STUDIO_CLERK_JWT_TEMPLATE: ${{ vars.STUDIO_CLERK_JWT_TEMPLATE }}
          STUDIO_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.STUDIO_CLERK_CLI_OAUTH_CLIENT_ID }}
          STUDIO_RELAY_URL: ${{ vars.STUDIO_RELAY_URL }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/release-settings"
          rm -rf "$dir"
          mkdir -p "$dir"
          printf '%s' "$CSC_LINK" | base64 -D > "$dir/developerID_application.p12"
          printf '%s' "$CSC_KEY_PASSWORD" > "$dir/p12.passphrase"
          printf '%s' "$APPLE_API_KEY" > "$dir/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf 'STUDIO_GOOGLE_OAUTH_CLIENT_ID=%s\nSTUDIO_GOOGLE_OAUTH_CLIENT_SECRET=%s\n' \
            "$STUDIO_GOOGLE_OAUTH_CLIENT_ID" "$STUDIO_GOOGLE_OAUTH_CLIENT_SECRET" > "$dir/google-oauth.env"
          # The release's own git identity and credentials, without touching ~/.gitconfig.
          # Stage-1 and server tests run with GIT_CONFIG_GLOBAL=/dev/null, so they never see it.
          printf '[user]\n\tname = Anton Abyzov\n\temail = 979819+anton-abyzov@users.noreply.github.com\n[credential "https://github.com"]\n\thelper =\n\thelper = !gh auth git-credential\n' > "$dir/gitconfig"
          {
            printf 'CSC_LINK_PATH="%s"\n' "$dir/developerID_application.p12"
            printf 'CSC_PASSPHRASE_FILE="%s"\n' "$dir/p12.passphrase"
            printf 'APPLE_API_KEY_PATH="%s"\n' "$dir/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf 'APPLE_API_KEY_ID="%s"\n' "$APPLE_API_KEY_ID"
            printf 'APPLE_API_ISSUER="%s"\n' "$APPLE_API_ISSUER"
            printf 'GOOGLE_OAUTH_ENV_FILE="%s"\n' "$dir/google-oauth.env"
            for key in STUDIO_CLERK_PUBLISHABLE_KEY STUDIO_CLERK_JWT_TEMPLATE \
              STUDIO_CLERK_CLI_OAUTH_CLIENT_ID STUDIO_RELAY_URL; do
              if [ -n "${!key}" ]; then printf '%s="%s"\n' "$key" "${!key}"; fi
            done
            printf 'NODE_VERSION="22.20.0"\n'
            printf 'SDKROOT="%s"\n' "$(xcrun --sdk macosx --show-sdk-path)"
          } > "$dir/release.env"
          chmod 600 "$dir"/*
          {
            echo "RELEASE_ENV=$dir/release.env"
            echo "GIT_CONFIG_GLOBAL=$dir/gitconfig"
            echo "RELEASE_NODE_BIN=$(dirname "$(command -v node)")"
          } >> "$GITHUB_ENV"

      # The server suite's preview tests drive a headless Chromium; the M4 has it cached.
      - name: Install Playwright Chromium headless shell
        shell: bash
        run: npx -y "playwright-core@$(node -p "require('./apps/server/package.json').dependencies['playwright-core']")" install --only-shell chromium

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          INPUT_PREVIOUS: ${{ inputs.previous }}
          INPUT_STOP_AFTER: ${{ inputs.stop_after }}
          INPUT_RESUME: ${{ inputs.resume }}
        shell: bash
        run: |
          set -euo pipefail
          # Server shards run one test file at a time each, so they scale with cores the
          # stage-1 pool does not need. release.sh caps RELEASE_SERVER_SHARDS at 6.
          export RELEASE_SERVER_SHARDS="$(( $(sysctl -n hw.ncpu) >= 10 ? 6 : 4 ))"
          args=("$RELEASE_VERSION" --ci --jobs "$(( $(sysctl -n hw.ncpu) > 4 ? 4 : 2 ))")
          if [ -n "$INPUT_PREVIOUS" ]; then args+=(--previous "$INPUT_PREVIOUS"); fi
          if [ -n "$INPUT_STOP_AFTER" ]; then args+=(--stop-after "$INPUT_STOP_AFTER"); fi
          if [ "$INPUT_RESUME" = true ]; then args+=(--resume); fi
          bash scripts/release/release.sh "${args[@]}"

      - name: Upload logs and timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.version }}-logs
          path: |
            ~/.specwithcode/release-staging/${{ inputs.version }}/logs
            ~/.specwithcode/release-staging/${{ inputs.version }}/timings
            ~/.specwithcode/release-staging/${{ inputs.version }}/release.json
            ~/.specwithcode/release-staging/${{ inputs.version }}/google-verify-*
            ~/.specwithcode/release-staging/${{ inputs.version }}/server/*/shards.json
            ~/.specwithcode/release-staging/${{ inputs.version }}/server/*/server-*.json
            ~/.specwithcode/release-staging/${{ inputs.version }}/stage1/*/*.secs
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove release settings
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/release-settings"

  # Provenance for the published macOS files, while the repository is public.
  attest_macos:
    needs: [release]
    # A run stopped before publishing (stop_after) has nothing published to attest.
    if: ${{ inputs.stop_after == '' }}
    uses: ./.github/workflows/attest-macos.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      version: ${{ inputs.version }}
