name: Desktop macOS unsigned build

# Manual, unsigned Apple silicon build of the desktop app on a GitHub-hosted
# runner. It needs no secrets and publishes nothing: the dmg and zip are kept
# as a workflow artifact for testing. Unsigned apps open only after
# right-click > Open (or `xattr -dr com.apple.quarantine`) on the test Mac.
# Signed and notarized builds come later through release.yml once a
# Developer ID certificate and App Store Connect API key are configured.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-macos-unsigned-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned dmg (arm64)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Hosted relay, telemetry and self-update stay off in this build.
      STUDIO_DESKTOP_SIGNED: "false"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      # checkout's credential cleanup runs submodule foreach even with
      # submodules disabled, which fails on the orphaned gitlinks in the
      # vendored .repos tree, so fetch by hand and leave .repos out.
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ inputs.ref }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64)"
          git -c http.extraheader="$auth" fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Install desktop dependencies
        run: vp install --filter=@specweave-studio/desktop... --filter=specweave-studio... --filter=@specweave-studio/web... --filter=@specweave-studio/scripts...

      - name: Build unsigned dmg
        run: node scripts/build-desktop-artifact.ts --platform mac --target dmg --arch arm64

      - name: Smoke test the packaged main process
        run: node apps/desktop/scripts/smoke-test.mjs

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: specweave-studio-macos-arm64-unsigned
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14
