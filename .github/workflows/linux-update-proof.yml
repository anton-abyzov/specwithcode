name: Linux update proof

# The previous published .deb updates itself to the candidate on a clean Ubuntu, through the real
# updater, pkexec and relaunch (scripts/linux-update-proof.mjs). The release workflow calls this
# and will not attach Linux feeds unless it passes. A manual run proves two published releases.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      artifact:
        required: false
        type: string
        default: ""
      phases:
        required: false
        type: string
        default: update,retry,replaced,signed
  workflow_dispatch:
    inputs:
      version:
        description: Candidate, a published X.Y.Z
        required: true
        type: string
      phases:
        description: update, retry, replaced, signed (retry and replaced need a candidate with #1199)
        required: false
        type: string
        default: update,retry,replaced,signed

permissions:
  contents: read
  actions: read

jobs:
  prove:
    name: Update ${{ inputs.version }} on clean ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported systemd and polkit and the newest: their behaviour differs.
        include:
          - os: ubuntu-22.04
            polkit: policykit-1
          - os: ubuntu-24.04
            polkit: pkexec polkitd
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
      PUBLIC_REPOSITORY: anton-abyzov/specwithcode
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
      - name: Install what a desktop has
        env:
          POLKIT: ${{ matrix.polkit }}
        run: |
          sudo apt-get update -q
          # shellcheck disable=SC2086
          sudo apt-get install -y -q xvfb dbus-user-session $POLKIT
          # The user service manager a desktop session has: the app restarts through it.
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
      - name: Download the candidate .deb
        if: ${{ inputs.artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/candidate
      - name: Fetch the published .debs
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous" "$RUNNER_TEMP/candidate"
          if [ -z "$ARTIFACT" ]; then
            gh release download "v$VERSION" -R "$PUBLIC_REPOSITORY" -p '*-amd64.deb' -p latest-linux.yml -D "$RUNNER_TEMP/candidate"
          fi
          # The newest published release below the candidate that carries a .deb.
          previous=$(gh release list -R "$PUBLIC_REPOSITORY" -L 40 --exclude-pre-releases --json tagName --jq '.[].tagName' \
            | sed 's/^v//' | sort -rV \
            | while read -r v; do
                [ "$v" = "$VERSION" ] && continue
                [ "$(printf '%s\n%s\n' "$v" "$VERSION" | sort -V | head -1)" = "$v" ] || continue
                # Read in full first: a pipe into grep -q kills gh, and pipefail reads that as no .deb.
                assets=$(gh release view "v$v" -R "$PUBLIC_REPOSITORY" --json assets --jq '.assets[].name')
                if grep -q -- '-amd64.deb$' <<<"$assets"; then echo "$v"; break; fi
              done)
          [ -n "$previous" ] || { echo "::error::No published .deb below $VERSION"; exit 1; }
          echo "previous release: $previous"
          gh release download "v$previous" -R "$PUBLIC_REPOSITORY" -p '*-amd64.deb' -D "$RUNNER_TEMP/previous"
      - name: Prove the update
        env:
          PHASES: ${{ inputs.phases || 'update,retry,replaced,signed' }}
        run: |
          node scripts/linux-update-proof.mjs \
            --previous "$(ls "$RUNNER_TEMP"/previous/*-amd64.deb)" \
            --candidate "$(ls "$RUNNER_TEMP"/candidate/*-amd64.deb)" \
            --candidate-feed "$RUNNER_TEMP/candidate/latest-linux.yml" \
            --evidence "$RUNNER_TEMP/evidence" \
            --phases "$PHASES"
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-update-proof-${{ inputs.version }}-${{ matrix.os }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 14
