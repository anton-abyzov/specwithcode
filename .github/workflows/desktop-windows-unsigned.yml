name: Desktop Windows unsigned build

# Manual, unsigned x64 build of the desktop app on a GitHub-hosted Windows
# runner. It needs no secrets and publishes nothing: the installer is kept as
# a workflow artifact for testing. Windows SmartScreen warns on an unsigned
# installer; choose More info > Run anyway on the test PC. The WSL backend is
# left out (it needs the Linux CLI archive from a release run); the native
# Windows backend works without it. Signed builds come only from
# release-windows-linux.yml, once its Azure Trusted Signing secrets are set.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-windows-unsigned-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned installer (x64)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      STUDIO_DESKTOP_SIGNED: "false"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      # Same hand checkout as the macOS build: .repos holds orphaned gitlinks
      # that break actions/checkout's cleanup.
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ inputs.ref }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup Vite+
        env:
          npm_config_global_pnpmfile: ${{ github.workspace }}/scripts/studio-toolchain/bootstrap-pnpmfile.cjs
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # The resource monitor links the Spectre-mitigated MSVC runtime.
      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Install desktop dependencies
        run: vp install --filter=@specweave-studio/desktop... --filter=specweave-studio... --filter=@specweave-studio/web... --filter=@specweave-studio/scripts...

      - name: Build unsigned installer
        run: node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64

      - name: Smoke test the packaged main process
        run: node apps/desktop/scripts/smoke-test.mjs

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: specweave-studio-windows-x64-unsigned
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
