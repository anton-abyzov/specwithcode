name: Chaos rigs

# 1465: model-free chaos runs against one scratch server (scripts/studio-chaos/). Fake ACP
# agents flip usage limits on and off during the run on a seeded schedule; a checker reads the
# server's projections and the agents' own turn logs for three rules: a message runs once and in
# order, every worker's result reaches its launcher, and an automatic fallback never returns to
# a source before that source's limit resets. No model tokens are spent and no live data is read.
#
# Report only: the job never blocks a merge (continue-on-error). A red scenario prints its seed
# and the command that replays it. Runs nightly on main, on demand, and on a pull request that
# carries the `chaos-rig` label.

on:
  schedule:
    # 07:23 UTC, after the platform suites.
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: Space-separated seeds per scenario (empty picks three at random)
        required: false
        default: ""
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  chaos:
    name: Chaos rigs (report only)
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'chaos-rig') &&
      (github.event.action != 'labeled' || github.event.label.name == 'chaos-rig'))
    concurrency:
      group: chaos-rigs-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    env:
      SEEDS: ${{ inputs.seeds }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        env:
          npm_config_global_pnpmfile: ${{ github.workspace }}/scripts/studio-toolchain/bootstrap-pnpmfile.cjs
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 22.20.0
          cache: true
          run-install: true

      - name: Checker self-test
        run: node --test scripts/studio-chaos/check.test.mjs

      - name: Run scenarios
        run: |
          out="$RUNNER_TEMP/chaos"
          mkdir -p "$out"
          seeds="${SEEDS:-$(for _ in 1 2 3; do echo $(( (RANDOM << 15 | RANDOM) + 1 )); done)}"
          status=0
          {
            echo "## Chaos rigs"
            echo
            echo "| Scenario | Seed | Verdict | Violations | Replay |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for scenario in ping-pong storm; do
            for seed in $seeds; do
              dir="$out/$scenario-$seed"
              code=0
              node scripts/studio-chaos/fallback-storm.mjs --scenario "$scenario" --seed "$seed" --out "$dir" || code=$?
              verdict=$(node -e 'const r=require(process.argv[1]);console.log(r.verdict+"\t"+r.violations.length)' "$dir/receipt.json" 2>/dev/null || printf 'error\t?')
              echo "| $scenario | $seed | ${verdict%%$'\t'*} | ${verdict##*$'\t'} | \`node scripts/studio-chaos/fallback-storm.mjs --scenario $scenario --seed $seed\` |" >> "$GITHUB_STEP_SUMMARY"
              [ "$code" -eq 0 ] || status=1
            done
          done
          exit "$status"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chaos-receipts
          path: ${{ runner.temp }}/chaos
          retention-days: 14
          if-no-files-found: warn
