name: Connect relay edge rules

# Adds or updates the relay's WAF and rate-limiting rules on the API zone.
# Run by hand; the script appends its own rules and leaves the zone's other
# rules alone.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only read the zone's rulesets.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  edge_rules:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Apply edge rules
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELAY_API_ZONE_NAME: ${{ vars.RELAY_API_ZONE_NAME }}
          RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
        run: node infra/relay/scripts/edge-rules.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
