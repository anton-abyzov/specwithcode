name: Android

on:
  pull_request:
    paths:
      - apps/android/**
      - .github/workflows/android.yml
  push:
    branches:
      - main
    paths:
      - apps/android/**
      - .github/workflows/android.yml

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/android

env:
  # CI never has the upload key, so release builds are unsigned.
  SWC_ANDROID_SIGNING_PROPERTIES: /nonexistent/specwithcode-android-upload.properties
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: Tests, lint and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Unit tests
        run: ./gradlew --console=plain test

      - name: Lint
        run: ./gradlew --console=plain :app:lintDebug

      - name: Debug APK
        run: ./gradlew --console=plain :app:assembleDebug

      - name: Release bundle (unsigned)
        run: ./gradlew --console=plain :app:bundleRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            apps/android/*/build/reports/
            apps/android/*/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-builds
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/bundle/release/app-release.aab
            apps/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Smoke test on emulator (API ${{ matrix.api-level }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: ./gradlew --console=plain :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: apps/android
          # The package service can lag sys.boot_completed on CI emulators; wait for it first.
          script: |
            adb wait-for-device shell 'for i in $(seq 1 90); do pm path android >/dev/null 2>&1 && exit 0; sleep 2; done; exit 1'
            ./gradlew --console=plain :app:connectedDebugAndroidTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-smoke-api-${{ matrix.api-level }}
          path: |
            apps/android/app/build/outputs/androidTest-results/
            apps/android/app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14
