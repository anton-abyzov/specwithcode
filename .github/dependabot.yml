# Keeps the SHA-pinned GitHub Actions current. npm dependencies are not updated here: the
# lockfile and pnpm's minimum release age govern them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A new action release waits a week before a pull request proposes it.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
