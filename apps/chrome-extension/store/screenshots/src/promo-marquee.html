<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
      }
      body {
        width: 1400px;
        height: 560px;
        overflow: hidden;
        font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(135deg, #5b6cff 0%, #3f4fe0 55%, #2f3bb8 100%);
        color: #fff;
        display: grid;
        grid-template-columns: 640px 1fr;
        align-items: center;
        gap: 56px;
        padding: 0 80px;
        box-sizing: border-box;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .top img {
        width: 104px;
        height: 104px;
        border-radius: 22px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
      }
      h1 {
        margin: 0;
        font-size: 52px;
        line-height: 1.05;
        letter-spacing: -0.015em;
      }
      p {
        margin: 30px 0 26px;
        font-size: 28px;
        line-height: 1.35;
        color: #e6e9ff;
      }
      .agents {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .agents span {
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.35);
        padding: 7px 14px;
        border-radius: 999px;
        font-size: 17px;
        font-weight: 600;
      }
      .window {
        background: #dee1e6;
        border-radius: 14px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        overflow: hidden;
        color: #1f2328;
      }
      .tabs {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        padding: 12px 14px 0;
      }
      .chip {
        background: #1a73e8;
        color: #fff;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 8px;
        white-space: nowrap;
      }
      .tab {
        background: #f1f3f4;
        border-radius: 10px 10px 0 0;
        padding: 10px 16px;
        font-size: 15px;
        border-bottom: 3px solid #1a73e8;
        white-space: nowrap;
      }
      .tab.active {
        background: #fff;
      }
      .tab.mine {
        border-bottom-color: transparent;
        color: #5f6368;
      }
      .page {
        background: #fff;
        height: 250px;
        padding: 26px 28px;
        box-sizing: border-box;
      }
      .bar {
        height: 14px;
        border-radius: 7px;
        background: #e8eaed;
        margin-bottom: 14px;
      }
      .cursor {
        display: inline-block;
        margin-top: 16px;
        background: #e8f0fe;
        color: #1a73e8;
        font-size: 15px;
        font-weight: 600;
        padding: 8px 14px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="top">
        <img src="/icons/icon-128.png" alt="" />
        <h1>SpecWithCode<br />Browser</h1>
      </div>
      <p>Let your agents use your signed-in Chrome, on this computer only.</p>
      <div class="agents">
        <span>Visible tab group</span><span>Pause any time</span><span>Unpair in one click</span>
      </div>
    </div>
    <div class="window">
      <div class="tabs">
        <span class="chip">SpecWithCode · Personal</span>
        <span class="tab active">Pull request #42</span>
        <span class="tab mine">Your tab</span>
      </div>
      <div class="page">
        <div class="bar" style="width: 72%"></div>
        <div class="bar" style="width: 90%"></div>
        <div class="bar" style="width: 64%"></div>
        <div class="bar" style="width: 82%"></div>
        <div class="cursor">Agent: reading the page and taking a screenshot</div>
      </div>
    </div>
  </body>
</html>
