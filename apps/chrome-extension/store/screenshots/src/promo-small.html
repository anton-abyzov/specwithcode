<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
      }
      body {
        width: 440px;
        height: 280px;
        overflow: hidden;
        font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(135deg, #5b6cff 0%, #3f4fe0 60%, #2f3bb8 100%);
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 34px;
        box-sizing: border-box;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.1;
        letter-spacing: -0.01em;
      }
      p {
        margin: 18px 0 14px;
        font-size: 18px;
        line-height: 1.35;
        color: #e6e9ff;
      }
      .chip {
        display: inline-block;
        background: #1a73e8;
        border: 1px solid rgba(255, 255, 255, 0.5);
        padding: 4px 11px;
        border-radius: 7px;
        font-size: 13px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <img src="/icons/icon-128.png" alt="" />
      <h1>SpecWithCode<br />Browser</h1>
    </div>
    <p>Let your agents use your Chrome, on this computer only.</p>
    <div><span class="chip">SpecWithCode · Personal</span></div>
  </body>
</html>
