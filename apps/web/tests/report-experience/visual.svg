  <g class="c-red"><rect x="40" y="200" width="250" height="52" rx="6" /><text class="t" x="165" y="222" text-anchor="middle">M4 to workers: Tailscale only</text><text class="ts" x="165" y="241" text-anchor="middle">no Tailscale = no delegation</text></g>

