<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Output language verification</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Set the fixture preference before useTheme initializes browser chrome.
      localStorage.setItem(
        "studio:theme",
        new URLSearchParams(location.search).get("theme") === "dark" ? "dark" : "light",
      );
    </script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
