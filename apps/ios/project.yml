name: SpecWithCode
options:
  bundleIdPrefix: com.specwithcode
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ${STUDIO_APPLE_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
packages:
  SWCKit:
    path: SWCKit
  Clerk:
    url: https://github.com/clerk/clerk-ios
    exactVersion: 1.6.1
targets:
  SpecWithCode:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Tests/**"
    dependencies:
      - package: SWCKit
        product: SWCFeatures
      - package: SWCKit
        product: SWCSync
      - package: SWCKit
        product: SWCTransport
      - package: Clerk
        product: ClerkKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.specwithcode.ios
        PRODUCT_NAME: SpecWithCode
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SpecWithCode
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the pairing QR code shown by SpecWithCode on your computer.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to SpecWithCode on computers in your home or office network.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # SpecWithCode Connect. Public values, read from the environment when
        # the project is generated; empty leaves Connect off. See README.md.
        SWC_CLERK_PUBLISHABLE_KEY: ${STUDIO_CLERK_PUBLISHABLE_KEY}
        SWC_CLERK_JWT_TEMPLATE: ${STUDIO_CLERK_JWT_TEMPLATE}
        SWC_RELAY_URL: ${STUDIO_RELAY_URL}
        SWC_CLERK_OAUTH_PROVIDERS: ${STUDIO_CLERK_OAUTH_PROVIDERS}
        # Sign in with Apple and push need a provisioning profile with those
        # capabilities, so they are opt-in: Config/Connect.entitlements.
        CODE_SIGN_ENTITLEMENTS: ${STUDIO_CODE_SIGN_ENTITLEMENTS}
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.specwithcode.ios.dev
          INFOPLIST_KEY_CFBundleDisplayName: SpecWithCode Dev
          SWC_APS_ENVIRONMENT: development
        Release:
          SWC_APS_ENVIRONMENT: production
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.specwithcode.ios
            CFBundleURLSchemes: [specwithcode]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        SWCClerkPublishableKey: $(SWC_CLERK_PUBLISHABLE_KEY)
        SWCClerkJWTTemplate: $(SWC_CLERK_JWT_TEMPLATE)
        SWCRelayURL: $(SWC_RELAY_URL)
        SWCClerkOAuthProviders: $(SWC_CLERK_OAUTH_PROVIDERS)
        SWCApsEnvironment: $(SWC_APS_ENVIRONMENT)
        # Non-empty only in builds signed with Config/Connect.entitlements; turns push on.
        SWCCodeSignEntitlements: $(CODE_SIGN_ENTITLEMENTS)
        UIAppFonts: []
  SpecWithCodeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [App/Tests]
    dependencies:
      - target: SpecWithCode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.specwithcode.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  SpecWithCodeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: SpecWithCode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.specwithcode.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        # XCTestCase initializers are nonisolated; test classes opt in with @MainActor.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  SpecWithCode:
    build:
      targets:
        SpecWithCode: all
    test:
      targets: [SpecWithCodeTests, SpecWithCodeUITests]
